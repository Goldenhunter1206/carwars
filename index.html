<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Wars - Rocket League Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 24px;
      text-align: center;
    }

    #loading .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #333;
      border-top-color: #0af;
      border-radius: 50%;
      margin: 20px auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    #boost-meter {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 150px;
      height: 150px;
    }

    #score-display {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 30px;
      color: #fff;
      font-size: 48px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    #score-display .team-blue { color: #4af; }
    #score-display .team-orange { color: #fa4; }

    #timer {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 24px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="loading">
    <div class="spinner"></div>
    <div>Loading Car Wars...</div>
  </div>

  <div id="hud" style="display: none;">
    <div id="score-display">
      <span class="team-blue">0</span>
      <span>-</span>
      <span class="team-orange">0</span>
    </div>
    <div id="timer">5:00</div>
  </div>

  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
